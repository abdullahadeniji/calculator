<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement Controls</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f2f2f2; }

        #calculator {
            font-family: Arial, sans-serif;
            background-color: #262626;
        }

        #display,
        #display:focus {
            background-color: #333333;
            color: #ffffff;
            box-shadow: none;
        }

        #keys { grid-template-columns: repeat(4, 1fr); }

        #keys .btn {
            width: 75px;
            height: 75px;
            border: none;
            background-color: #4d4d4d;
            color: #f5f5f5;
        }
        #keys .btn:hover  { background-color: #808080; }
        #keys .btn:active { background-color: #b3b3b3; }

        #keys .operator-btn { background-color: #ff9f1a; }
        #keys .operator-btn:hover  { background-color: #ffb042; }
        #keys .operator-btn:active { background-color: #ffca80; }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 m-0">
    <div id="calculator" class="w-100 rounded-5 overflow-hidden" style="max-width: 372px;">
        <input id="display" class="form-control form-control-lg border-0 rounded-0 fs-1 p-3 text-start" readonly>
        <div id="keys" class="d-grid gap-2 p-4">
            <button onclick="appendToDisplay('+')" class="btn rounded-circle fs-3 fw-bold operator-btn">+</button>
            <button onclick="appendToDisplay('7')" class="btn rounded-circle fs-3 fw-bold">7</button>
            <button onclick="appendToDisplay('8')" class="btn rounded-circle fs-3 fw-bold">8</button>
            <button onclick="appendToDisplay('9')" class="btn rounded-circle fs-3 fw-bold">9</button>
            <button onclick="appendToDisplay('-')" class="btn rounded-circle fs-3 fw-bold operator-btn">-</button>
            <button onclick="appendToDisplay('4')" class="btn rounded-circle fs-3 fw-bold">4</button>
            <button onclick="appendToDisplay('5')" class="btn rounded-circle fs-3 fw-bold">5</button>
            <button onclick="appendToDisplay('6')" class="btn rounded-circle fs-3 fw-bold">6</button>
            <button onclick="appendToDisplay('*')" class="btn rounded-circle fs-3 fw-bold operator-btn">*</button>
            <button onclick="appendToDisplay('1')" class="btn rounded-circle fs-3 fw-bold">1</button>
            <button onclick="appendToDisplay('2')" class="btn rounded-circle fs-3 fw-bold">2</button>
            <button onclick="appendToDisplay('3')" class="btn rounded-circle fs-3 fw-bold">3</button>
            <button onclick="appendToDisplay('/')" class="btn rounded-circle fs-3 fw-bold operator-btn">/</button>
            <button onclick="appendToDisplay('0')" class="btn rounded-circle fs-3 fw-bold">0</button>
            <button onclick="appendToDisplay('.')" class="btn rounded-circle fs-3 fw-bold">.</button>
            <button onclick="calculate()" class="btn rounded-circle fs-3 fw-bold">=</button>
            <button onclick="clearDisplay()" class="btn rounded-circle fs-3 fw-bold operator-btn">C</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
